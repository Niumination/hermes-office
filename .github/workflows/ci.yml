name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci || npm install
      - name: Lint (syntax)
        run: node --check server/index.js && node --check server/eventbus.js && node --check server/auth.js
      - name: Unit tests
        run: node --test tests/ || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
