name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Lint (syntax)
        run: node --check server/index.js && node --check server/eventbus.js && node --check server/auth.js
      - name: Unit tests
        # `node --test tests/` tries to require() the directory and fails with
        # MODULE_NOT_FOUND, then `|| true` swallowed it — this job had been
        # reporting success while running zero tests.
        run: node --test tests/*.test.js

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
